<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with dark gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ticketGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGradient)"/>
  
  <!-- Ticket shape -->
  <g transform="translate(12, 18)">
    <!-- Main ticket body -->
    <rect x="0" y="0" width="40" height="28" rx="3" fill="url(#ticketGradient)"/>
    
    <!-- Perforation line (dashed) -->
    <line x1="26" y1="2" x2="26" y2="26" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>
    
    <!-- Left section details -->
    <circle cx="8" cy="8" r="2" fill="#0a0a0a" opacity="0.2"/>
    <rect x="4" y="14" width="14" height="2" rx="1" fill="#0a0a0a" opacity="0.2"/>
    <rect x="4" y="19" width="10" height="2" rx="1" fill="#0a0a0a" opacity="0.2"/>
    
    <!-- Right section (stub) -->
    <rect x="30" y="8" width="6" height="2" rx="1" fill="#0a0a0a" opacity="0.2"/>
    <rect x="30" y="13" width="6" height="2" rx="1" fill="#0a0a0a" opacity="0.2"/>
    <rect x="30" y="18" width="6" height="2" rx="1" fill="#0a0a0a" opacity="0.2"/>
    
    <!-- Notches on sides -->
    <circle cx="26" cy="0" r="3" fill="url(#bgGradient)"/>
    <circle cx="26" cy="28" r="3" fill="url(#bgGradient)"/>
  </g>
  
  <!-- Sparkle/star accent -->
  <circle cx="50" cy="16" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="54" cy="20" r="1" fill="#fbbf24" opacity="0.7"/>
  <circle cx="48" cy="21" r="0.8" fill="#fbbf24" opacity="0.5"/>
</svg>
